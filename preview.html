<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบสั่งวัสดุฝึก</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap');
/* ธีมโทนกรมท่า-ทอง (อ้างอิงสไตล์เว็บรับสมัครของมหาวิทยาลัย) */
:root{--bg:#f8fafc;--card:#fff;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--pri:#1e2b58;--navy2:#2c3e75;--dark:#0b1226;--gold:#d4af37;--gold-l:#e2b65c;--gold-d:#b8860b;--gold-glow:rgba(212,175,55,.25);
  --ok:#059669;--warn:#d97706;--bad:#dc2626;--fh:'Kanit',"Leelawadee UI",Tahoma,sans-serif;--fb:'Sarabun',"Leelawadee UI","TH Sarabun New",Tahoma,sans-serif;
  --sh-sm:0 1px 3px rgba(0,0,0,.05);--sh-md:0 4px 6px -1px rgba(0,0,0,.05),0 2px 4px -1px rgba(0,0,0,.03);--sh-lg:0 10px 15px -3px rgba(30,43,88,.08),0 4px 6px -2px rgba(30,43,88,.04);--tr:all .3s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--fb)}
.topbar{display:flex;align-items:center;gap:20px;background:var(--dark);color:#fff;padding:10px 24px;position:sticky;top:0;z-index:5;flex-wrap:wrap;box-shadow:var(--sh-md)}
.brand{font-family:var(--fh);font-weight:600;font-size:18px;color:#fff}.brand small{font-family:var(--fb);font-weight:400;color:var(--gold-l);opacity:.9;margin-left:8px;font-size:12px}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav a{font-family:var(--fh);font-weight:500;font-size:15px;color:rgba(255,255,255,.75);text-decoration:none;padding:6px 14px;border-radius:8px;transition:var(--tr)}
nav a:hover{color:var(--gold-l)}
nav a.on{color:var(--gold-l);background:rgba(212,175,55,.12);box-shadow:inset 0 -2px 0 var(--gold)}
.live{font-size:12px;color:#fca5a5}.live.ok{color:#6ee7b7}
main{max-width:1200px;margin:0 auto;padding:20px}
h1,h2,h3{font-family:var(--fh);color:var(--pri);font-weight:600}
h1{font-size:26px;margin:0 0 18px}h2{font-size:18px;margin:0 0 10px}
h1::after{content:'';display:block;width:60px;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold-l));margin-top:6px;border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:var(--sh-lg)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:140px}.row>.fix{flex:none;min-width:0}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;padding:8px 11px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink);transition:var(--tr)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--navy2);background:#fff;box-shadow:0 0 0 3px rgba(30,43,88,.08)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--pri)}
button,.btn{font-family:var(--fh);font-weight:500;background:linear-gradient(135deg,var(--gold-l) 0%,var(--gold) 100%);color:var(--dark);border:0;border-radius:8px;padding:9px 18px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 4px 10px var(--gold-glow);transition:var(--tr)}
button:hover,.btn:hover{transform:translateY(-1px);background:linear-gradient(135deg,var(--gold) 0%,var(--gold-d) 100%);box-shadow:0 8px 20px var(--gold-glow)}
button.sec,.btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--line);box-shadow:var(--sh-sm)}
button.sec:hover,.btn.sec:hover{background:#fff;border-color:var(--navy2);box-shadow:var(--sh-md)}
button.ok{background:var(--ok);color:#fff;box-shadow:none}button.ok:hover{background:#047857;box-shadow:none}
button.bad{background:var(--bad);color:#fff;box-shadow:none}button.bad:hover{background:#b91c1c;box-shadow:none}
button.sm{padding:3px 10px;font-size:13px}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--sh-lg);border-top:3px solid var(--gold);transition:var(--tr)}
.kpi:hover{transform:translateY(-2px);box-shadow:0 20px 25px -5px rgba(30,43,88,.15)}
.kpi .l{font-size:13px;color:var(--mut)}.kpi .v{font-family:var(--fh);font-size:26px;font-weight:600;color:var(--pri)}.kpi .s{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chartbox{position:relative;height:300px}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-family:var(--fh);font-weight:500;font-size:13px;color:var(--pri);background:var(--bg)}
table.t tr:hover td{background:rgba(30,43,88,.02)}
table.t.fixed{table-layout:fixed;min-width:1110px}
table.t td.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:grid;grid-template-columns:54px 54px 92px 68px 40px;gap:6px;align-items:center}
.acts>*{box-sizing:border-box;width:100%;height:28px;line-height:22px;padding:2px 0!important;font-size:13px;text-align:center;white-space:nowrap}
.r{text-align:right!important}.c{text-align:center!important}
.bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;min-width:100px;display:flex}
.bar i{display:block;height:100%}
.pill{padding:3px 12px;border-radius:20px;font-family:var(--fh);font-weight:500;font-size:12px;white-space:nowrap}
.pill.pending{background:rgba(245,158,11,.12);color:#b45309}.pill.approved{background:rgba(16,185,129,.12);color:#047857}.pill.cancelled{background:rgba(239,68,68,.12);color:#b91c1c}
.neg{color:var(--bad);font-weight:700}.warnc{color:var(--warn);font-weight:700}
.alert{padding:8px 12px;border-radius:6px;background:#fef2f2;color:#991b1b;margin:8px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 18px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.items input{padding:5px 6px}.items td{padding:3px}
.items .tot{text-align:right;font-variant-numeric:tabular-nums}
.totals{margin-left:auto;width:340px}.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .g{font-weight:700;border-top:2px solid var(--ink);margin-top:4px;padding-top:6px;font-size:17px}
.inl{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.inl label{display:inline;font-size:14px;color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}

/* ===== หน้าพิมพ์ฟอร์ม ว1ก. (A4) ===== */
.paper{background:#cbd5e1;padding:16px 0}
.sheet{width:210mm;min-height:297mm;margin:0 auto 16px;background:#fff;padding:8mm 12mm;color:#000;
  font:12pt/1.15 "TH SarabunPSK","TH Sarabun New","Leelawadee UI",Tahoma,sans-serif;box-shadow:0 2px 8px #0003;position:relative;display:flex;flex-direction:column}
.sheet .hd{position:relative;text-align:center}
.sheet .hd .code{position:absolute;right:0;top:0;border:1px solid #000;padding:0 8px}
.sheet .hd b{font-size:14pt}
.sheet .hd .logo{position:absolute;left:0;top:0;height:17mm;width:auto}
.sheet .pg{position:absolute;right:12mm;top:5mm;font-size:10pt}
.sheet .ln{display:flex;gap:6px;align-items:baseline;margin:1px 0}
.sheet .dots{border-bottom:1px dotted #000;flex:1;padding:0 4px;min-height:1.1em}
.sheet .dots.n{flex:none}
.sheet .bx{display:inline-block;width:10pt;height:10pt;border:1px solid #000;margin-right:3px;vertical-align:-1px;text-align:center;line-height:9pt;font-size:9pt}
.sheet .twocol{display:flex;gap:10px}.sheet .twocol>div{flex:1}
table.form{width:100%;border-collapse:collapse;margin-top:4px;table-layout:fixed}
table.form th,table.form td{border:1px solid #000;padding:0 4px;height:5.3mm;font-size:11pt;line-height:1.05;overflow:hidden}
table.form th{text-align:center;font-weight:400;height:auto;line-height:1.15}
table.form td.nm{line-height:1.1;font-size:11pt}
table.form td.n{text-align:right}table.form td.c{text-align:center}
table.form tfoot td{border-top:2px solid #000}
.sheet .foot{margin-top:6px}
.sheet .sign{text-align:center;margin:4px 0}
.sheet .box{border:1px solid #000;padding:3px 8px}
.attc{min-width:230px}.atrow{display:flex;gap:6px}.ats{font-size:12px;margin-top:2px}
.rcv td,.rcv th{vertical-align:middle}.rcv input[type=checkbox]{width:20px;height:20px}.rcv tr.done td{background:#f0fdf4}
.sheet.att{padding:8mm;align-items:center}
.sheet.att .atcap{font-size:10pt;color:#444;align-self:stretch;text-align:center;margin-bottom:3mm}
.sheet.att img{max-width:100%;max-height:272mm;object-fit:contain;display:block}
.attlist{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.attitem{width:96px;text-align:center;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff}
.attitem img{width:100%;height:120px;object-fit:contain;background:#f1f5f9;display:block;margin-bottom:3px}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .no-print,.topbar,.toast,.sitefoot{display:none!important}
  main{max-width:none;padding:0;margin:0}
  .paper{background:none;padding:0}
  .sheet{margin:0;box-shadow:none;page-break-after:always;break-after:page;height:297mm;min-height:0;overflow:hidden}
  .sheet:last-child{page-break-after:auto;break-after:auto}
}


/* ===== login / modal / user chip ===== */
.login{max-width:380px;margin:60px auto}
.login h1{text-align:center}
.login .card{padding:24px}
.login input{margin-bottom:10px;font-size:16px}
.login .hint{font-size:13px;color:var(--mut);margin:6px 0 12px}
.userchip{font-size:13px;color:#cfe0ff;display:flex;gap:8px;align-items:center}
.userchip button{padding:3px 10px;font-size:12px;background:#ffffff22;color:#fff;border:1px solid #ffffff55}
.modal-bg{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:10px;padding:20px;min-width:300px;max-width:90vw;box-shadow:0 10px 30px #0004}
.modal p{margin:0 0 12px;white-space:pre-wrap}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.role{font-size:11px;padding:1px 8px;border-radius:99px;background:rgba(212,175,55,.2);color:var(--gold-d)}
/* แถบหัวหน้าแรก (hero) + ท้ายหน้า */
.hero{background:radial-gradient(circle at 80% 20%,var(--navy2) 0%,var(--dark) 100%);color:#fff;border-radius:16px;padding:26px 28px 54px;margin-bottom:0;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30%;right:12%;width:320px;height:320px;background:radial-gradient(circle,rgba(212,175,55,.18) 0%,transparent 70%);filter:blur(40px);pointer-events:none}
.hero .tag{display:inline-block;background:rgba(212,175,55,.15);border:1px solid var(--gold);color:var(--gold-l);padding:3px 14px;border-radius:30px;font-family:var(--fh);font-size:13px;margin-bottom:10px}
.hero h1{color:#fff;margin:0 0 6px;font-size:28px}.hero h1::after{background:linear-gradient(90deg,var(--gold),#fff)}
.hero p{margin:10px 0 0;color:rgba(255,255,255,.8)}
.hero .hrow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}.hero .hrow>div:first-child{flex:1;min-width:260px}
.hero select{background:#fff}
.hero-kpis{margin-top:-34px;position:relative;z-index:2}
.sitefoot{background:var(--dark);color:rgba(255,255,255,.7);text-align:center;padding:18px 20px;margin-top:30px;font-size:13px}
.sitefoot b{color:var(--gold-l);font-family:var(--fh);font-weight:500}
</style>

</head>
<body>
<header class="topbar no-print" id="topbar" style="display:none">
  <div class="brand">ระบบสั่งวัสดุฝึก <small>สาขาวิศวกรรมโยธาและสิ่งแวดล้อม</small></div>
  <nav id="nav">
    <a href="#/" data-r="dash">สรุปภาพรวม</a>
    <a href="#/orders" data-r="orders">รายการใบสั่ง</a>
    <a href="#/order/new" data-r="form">+ สร้างใบสั่ง</a>
    <a href="#/receive" data-r="recv">ตรวจรับวัสดุ</a>
    <a href="#/settings" data-r="settings" id="nav-settings" style="display:none">ตั้งค่า</a>
  </nav>
  <div class="live" id="live" title="อัปเดตอัตโนมัติทุก 8 วินาที">● อัปเดตอัตโนมัติ</div>
  <div class="userchip"><span id="who"></span><button id="logout" class="sec">ออกจากระบบ</button></div>
</header>
<main id="app"></main>
<footer class="sitefoot no-print">© 2026 <b>มหาวิทยาลัยเทคโนโลยีราชมงคลล้านนา ตาก</b> • สาขาวิศวกรรมโยธาและสิ่งแวดล้อม • ระบบสั่งวัสดุฝึก</footer>
<div id="toast" class="toast no-print"></div>

<script>
// ===== บริการ Google จำลอง (เฉพาะ preview.html) — ข้อมูลเก็บใน localStorage ของเบราว์เซอร์นี้ =====
const PV_KEY = 'gas_preview_db';
let PV = { sheets: {}, props: {} };
try { PV = JSON.parse(localStorage.getItem(PV_KEY)) || PV; } catch (e) {}
const pvSave = () => { try { localStorage.setItem(PV_KEY, JSON.stringify(PV)); } catch (e) {} };
(function () {
  const cache = {}, p2 = n => String(n).padStart(2, '0');
  const mkSheet = name => { const s = PV.sheets[name] = PV.sheets[name] || { data: [] };
    return {
      getDataRange: () => ({ getValues: () => s.data.map(r => r.slice()) }),
      getLastRow: () => s.data.length, getMaxRows: () => 1000, setFrozenRows() {},
      deleteRow: r => { s.data.splice(r - 1, 1); },
      deleteRows: (r, n) => { s.data.splice(r - 1, n); },
      getRange: (r, c, nr = 1, nc = 1) => ({
        setValues: v => v.forEach((row, i) => { s.data[r - 1 + i] = s.data[r - 1 + i] || []; row.forEach((x, j) => s.data[r - 1 + i][c - 1 + j] = x); }),
        setNumberFormat() {} }) }; };
  const book = { getSheetByName: n => PV.sheets[n] ? mkSheet(n) : null, insertSheet: n => { PV.sheets[n] = { data: [] }; return mkSheet(n); },
    getSheets: () => Object.keys(PV.sheets).map(mkSheet), deleteSheet() {} };
  window.SpreadsheetApp = { getActiveSpreadsheet: () => book, openById: () => book };
  window.PropertiesService = { getScriptProperties: () => ({ getProperty: k => PV.props[k] ?? null, setProperty: (k, v) => { PV.props[k] = v; } }) };
  window.CacheService = { getScriptCache: () => ({ get: k => cache[k] ?? null, put: (k, v) => { cache[k] = v; }, remove: k => { delete cache[k]; } }) };
  window.LockService = { getScriptLock: () => ({ waitLock() {}, releaseLock() {} }) };
  window.__mail = [];
  window.MailApp = { sendEmail: o => window.__mail.push(o) };
  window.Session = { getScriptTimeZone: () => 'Asia/Bangkok', getEffectiveUser: () => ({ getEmail: () => 'kittisak.khonoeb@gmail.com' }) };
  window.Utilities = {
    formatDate: (d, tz, f) => { const b = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
      return f === 'yyyy-MM-dd' ? b : b + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); },
    getUuid: () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()),
    // ไม่ใช่ HMAC จริง — ใช้เฉพาะ preview ให้ logic ล็อกอินทำงาน (บน Google ใช้ของจริง)
    computeHmacSha256Signature: (s, k) => { let h = 2166136261, out = []; const str = k + '|' + s;
      for (let r = 0; r < 8; r++) { for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i) + r; h = Math.imul(h, 16777619); } out.push(h & 255, (h >> 8) & 255); } return out; },
    base64EncodeWebSafe: b => btoa(String.fromCharCode(...b.map(x => x & 255))).replace(/\+/g, '-').replace(/\//g, '_')
  };
  window.google = { script: { run: (function make(ok, fail) { return new Proxy({}, { get: (t, fn) =>
    fn === 'withSuccessHandler' ? f => make(f, fail) : fn === 'withFailureHandler' ? f => make(ok, f) :
    (...args) => setTimeout(() => { try { const r = window[fn](...args); pvSave(); ok && ok(JSON.parse(JSON.stringify(r === undefined ? null : r))); } catch (e) { fail && fail(e); } }, 3) }); })(null, null) } };
})();

/**
 * ระบบสั่งวัสดุฝึก — Google Apps Script (container-bound กับ Google Sheet)
 * ฐานข้อมูล = แท็บใน Google Sheet, ล็อกอินด้วยรหัส 6 หลักทางอีเมล
 *
 * หมายเหตุความปลอดภัย: ฟังก์ชันระดับบนสุด (ที่ไม่ลงท้ายด้วย _) เรียกได้จากเบราว์เซอร์ทั้งหมด
 * จึงมีเฉพาะ doGet / requestCode / verifyCode / handle / setup ส่วนที่เหลืออยู่ใน Core_ (เรียกจากข้างนอกไม่ได้)
 */
function doGet() { return Core_.doGet(); }
function requestCode(email) { return Core_.requestCode(email); }
function verifyCode(email, code) { return Core_.verifyCode(email, code); }
function handle(token, method, url, body) { return Core_.handle(token, method, url, body); }
function setup() { return Core_.setup(); }          // รันเองก็ได้ (ปลอดภัย รันซ้ำได้) — doGet เรียกให้อัตโนมัติครั้งแรก

const Core_ = (function () {
  const SESSION_DAYS = 7;
  const OTP_MINUTES = 10;
  const SCHEMA = {
    Departments: ['id', 'name', 'sort', 'active'],
    Rounds: ['id', 'name', 'note', 'budget', 'created_at'],
    Signers: ['id', 'name', 'role', 'active'],
    Settings: ['key', 'value'],
    Orders: ['id', 'round_id', 'dept_id', 'doc_no', 'date', 'proposer', 'head', 'mat_kind', 'mat_type', 'purpose_kind', 'level', 'subject',
      'purpose_other', 'need_date', 'budget_source', 'vat_mode', 'status', 'note', 'created_by', 'created_at', 'updated_at'],
    // recv* = การตรวจรับวัสดุ (recv: 1 = ได้รับแล้ว)
    Items: ['id', 'order_id', 'pos', 'name', 'qty', 'unit', 'last_price', 'price', 'recv', 'recv_by', 'recv_date', 'recv_note', 'recv_time'],
    Users: ['email', 'name', 'role', 'dept_id', 'active'],
    // เอกสารแนบ (ใบเสนอราคา) เก็บเป็นรูปทีละหน้า แบ่งเป็นท่อนละ ≤45,000 ตัวอักษร (ข้อจำกัดช่องละ 50,000 ของ Google Sheets)
    // item_pos = ลำดับรายการวัสดุที่แนบ (0 = แนบทั้งใบ)
    Attachments: ['order_id', 'page', 'part', 'data', 'item_pos']
  };
  // คอลัมน์ข้อความ (กัน Sheets แปลงเป็นวันที่/ตัวเลขเอง)
  const TEXT_COLS = {
    Orders: ['doc_no', 'date', 'need_date', 'proposer', 'head', 'level', 'subject', 'purpose_other', 'budget_source', 'note', 'created_by', 'created_at', 'updated_at'],
    Rounds: ['created_at'], Items: ['name', 'unit', 'recv_by', 'recv_date', 'recv_note', 'recv_time'], Users: ['email', 'name'], Attachments: ['data']
  };
  const ATT_CHUNK = 45000, ATT_MAX_PAGES = 20, ATT_MAX_CHARS = 4000000;

  const props = () => PropertiesService.getScriptProperties();
  const tz = () => Session.getScriptTimeZone() || 'Asia/Bangkok';
  const nowStr = () => Utilities.formatDate(new Date(), tz(), 'yyyy-MM-dd HH:mm:ss');
  const num = v => (v === '' || v == null || isNaN(+v)) ? 0 : +v;
  const err = (msg, code) => Object.assign(new Error(msg), { code: code || 400 });

  // ---------- Sheets helpers ----------
  const ss = () => { const id = props().getProperty('SHEET_ID'); return id ? SpreadsheetApp.openById(id) : SpreadsheetApp.getActiveSpreadsheet(); };
  const sheet = name => ss().getSheetByName(name);

  function readAll(name) {
    const v = sheet(name).getDataRange().getValues();
    const h = SCHEMA[name], out = [];
    for (let i = 1; i < v.length; i++) {
      if (v[i].every(x => x === '')) continue;
      const row = { _r: i + 1 };
      h.forEach((k, j) => {
        let x = v[i][j];
        if (x instanceof Date) x = Utilities.formatDate(x, tz(), 'yyyy-MM-dd');
        row[k] = x;
      });
      out.push(row);
    }
    return out;
  }
  const toRow = (name, o) => SCHEMA[name].map(k => o[k] == null ? '' : o[k]);
  function appendRows(name, objs) {
    if (!objs.length) return;
    const s = sheet(name), rows = objs.map(o => toRow(name, o)), start = s.getLastRow() + 1;
    // แถวที่เกินจำนวนที่ตั้งรูปแบบ "ข้อความ" ไว้ตอน setup: ตั้งใหม่ก่อนเขียน กันชื่อเช่น "1/2" ถูกแปลงเป็นวันที่
    if (start + rows.length - 1 > s.getMaxRows() - 1)
      (TEXT_COLS[name] || []).forEach(c => s.getRange(start, SCHEMA[name].indexOf(c) + 1, rows.length, 1).setNumberFormat('@'));
    s.getRange(start, 1, rows.length, SCHEMA[name].length).setValues(rows);
  }
  function updateRow(name, rowNo, o) {
    sheet(name).getRange(rowNo, 1, 1, SCHEMA[name].length).setValues([toRow(name, o)]);
  }
  function deleteRows(name, rowNos) {
    const s = sheet(name);
    rowNos.slice().sort((a, b) => b - a).forEach(r => s.deleteRow(r));
  }
  // ลบหลายแถวติดกันในครั้งเดียว (เอกสารแนบมีหลายสิบแถว ลบทีละแถวจะช้า)
  function deleteRowsFast(name, rowNos) {
    const s = sheet(name), rs = rowNos.slice().sort((a, b) => b - a);
    for (let i = 0; i < rs.length;) {
      let j = i; while (j + 1 < rs.length && rs[j + 1] === rs[j] - 1) j++;
      s.deleteRows(rs[j], j - i + 1); i = j + 1;
    }
  }
  const nextId = rows => rows.reduce((m, r) => Math.max(m, +r.id || 0), 0) + 1;
  const pick = (o, cols) => { const r = {}; cols.forEach(c => r[c] = o[c]); return r; };

  // ---------- setup ----------
  function setup() {
    const book = ss();
    Object.keys(SCHEMA).forEach(name => {
      let s = book.getSheetByName(name);
      if (!s) s = book.insertSheet(name);
      const h = SCHEMA[name];
      // เขียนหัวคอลัมน์ทุกครั้ง: ชีตเก่าที่ยังไม่มีคอลัมน์ใหม่ (เช่น ตรวจรับ) จะได้หัวครบ โดยไม่กระทบข้อมูลเดิม
      s.getRange(1, 1, 1, h.length).setValues([h]); s.setFrozenRows(1);
      (TEXT_COLS[name] || []).forEach(c => s.getRange(1, h.indexOf(c) + 1, s.getMaxRows(), 1).setNumberFormat('@'));
    });
    const first = book.getSheetByName('Sheet1');
    if (first && first.getLastRow() === 0 && book.getSheets().length > 1) book.deleteSheet(first);
    if (!props().getProperty('SECRET')) props().setProperty('SECRET', Utilities.getUuid() + Utilities.getUuid());
    if (!readAll('Departments').length)
      appendRows('Departments', ['โครงสร้าง', 'สำรวจ', 'ปฐพี', 'ส่วนกลางโยธา', 'ช่างก่อสร้าง'].map((n, i) => ({ id: i + 1, name: n, sort: i, active: 1 })));
    if (!readAll('Rounds').length) appendRows('Rounds', [{ id: 1, name: 'รอบที่ 1', note: '', budget: 0, created_at: nowStr() }]);
    if (!readAll('Signers').length) appendRows('Signers', [
      { id: 1, name: 'นายรุ่งโรจน์ จักภิระ', role: 'proposer', active: 1 }, { id: 2, name: 'นายพร้อมพงศ์ ฉลาดธัญญกิจ', role: 'head', active: 1 }]);
    if (!readAll('Settings').length) appendRows('Settings', [
      { key: 'org', value: 'มหาวิทยาลัยเทคโนโลยีราชมงคลล้านนาตาก' }, { key: 'branch', value: 'สาขาวิศวกรรมโยธาและสิ่งแวดล้อม' }]);
    if (!readAll('Users').length) {
      const owner = String(Session.getEffectiveUser().getEmail() || '').toLowerCase();
      if (owner) appendRows('Users', [{ email: owner, name: 'ผู้ดูแลระบบ', role: 'admin', dept_id: '', active: 1 }]);
    }
    return 'พร้อมใช้งาน';
  }
  const ensureSetup = () => { if (!props().getProperty('SECRET')) setup(); };

  // ---------- auth (รหัส 6 หลักทางอีเมล + token ลงลายเซ็น HMAC) ----------
  function sign_(s) {
    return Utilities.base64EncodeWebSafe(Utilities.computeHmacSha256Signature(s, props().getProperty('SECRET'))).replace(/=+$/, '');
  }
  const findUser = email => readAll('Users').find(u => String(u.email).toLowerCase() === String(email).toLowerCase() && +u.active);
  const publicUser = u => ({ email: String(u.email).toLowerCase(), name: u.name, role: u.role, dept_id: u.dept_id === '' ? null : +u.dept_id });

  function requestCode(emailRaw) {
    try {
      ensureSetup();
      const email = String(emailRaw || '').trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw err('รูปแบบอีเมลไม่ถูกต้อง');
      const cache = CacheService.getScriptCache();
      if (cache.get('otpr:' + email)) throw err('ขอรหัสได้ทุก 60 วินาที กรุณารอสักครู่');
      if (!findUser(email)) throw err('อีเมลนี้ยังไม่ได้รับอนุญาตให้ใช้ระบบ — ติดต่อผู้ดูแลเพื่อเพิ่มอีเมล');
      const code = String(Math.floor(100000 + Math.random() * 900000));
      cache.put('otp:' + email, JSON.stringify({ h: sign_(email + ':' + code), att: 0 }), OTP_MINUTES * 60);
      cache.put('otpr:' + email, '1', 60);
      MailApp.sendEmail({
        to: email, name: 'ระบบสั่งวัสดุฝึก', subject: 'รหัสเข้าสู่ระบบสั่งวัสดุฝึก: ' + code,
        body: 'รหัสเข้าสู่ระบบของคุณคือ ' + code + '\nรหัสนี้ใช้ได้ ' + OTP_MINUTES + ' นาที\nหากคุณไม่ได้ขอรหัสนี้ ให้ละเว้นอีเมลฉบับนี้'
      });
      return { ok: 1 };
    } catch (e) { return { error: e.message, code: e.code || 500 }; }
  }

  function verifyCode(emailRaw, codeRaw) {
    try {
      ensureSetup();
      const email = String(emailRaw || '').trim().toLowerCase(), code = String(codeRaw || '').trim();
      const cache = CacheService.getScriptCache();
      const rec = JSON.parse(cache.get('otp:' + email) || 'null');
      if (!rec) throw err('รหัสหมดอายุหรือยังไม่ได้ขอรหัส');
      if (rec.att >= 5) { cache.remove('otp:' + email); throw err('ใส่รหัสผิดเกินกำหนด กรุณาขอรหัสใหม่'); }
      if (rec.h !== sign_(email + ':' + code)) {
        rec.att++; cache.put('otp:' + email, JSON.stringify(rec), OTP_MINUTES * 60);
        throw err('รหัสไม่ถูกต้อง');
      }
      cache.remove('otp:' + email);
      const u = findUser(email);
      if (!u) throw err('อีเมลนี้ไม่ได้รับอนุญาต');
      const exp = Date.now() + SESSION_DAYS * 86400000;
      const payload = email + '|' + exp;
      return { token: payload + '|' + sign_(payload), me: publicUser(u) };
    } catch (e) { return { error: e.message, code: e.code || 500 }; }
  }

  function auth(token) {
    ensureSetup();
    const p = String(token || '').split('|');
    if (p.length !== 3 || sign_(p[0] + '|' + p[1]) !== p[2] || Date.now() > +p[1]) throw err('กรุณาเข้าสู่ระบบ', 401);
    const u = findUser(p[0]);   // ตรวจทุกครั้ง: ถ้าถูกปิดสิทธิ์/ลบ จะใช้ต่อไม่ได้ทันที
    if (!u) throw err('บัญชีนี้ถูกปิดสิทธิ์', 401);
    return publicUser(u);
  }

  // ---------- คำนวณ ----------
  function calc(items, mode) {
    const sum = items.reduce((s, i) => s + num(i.qty) * num(i.price), 0);
    let vat = 0, grand = sum;
    if (mode === 'incl') vat = sum * 7 / 107; else if (mode === 'excl') { vat = sum * 0.07; grand = sum + vat; }
    return { sum: sum, vat: vat, grand: grand, beforeVat: mode === 'incl' ? sum - vat : sum };
  }
  function itemsByOrder() {
    const m = {};
    readAll('Items').forEach(i => {
      i.last_price = i.last_price === '' ? null : i.last_price;
      (m[i.order_id] = m[i.order_id] || []).push(i);
    });
    Object.keys(m).forEach(k => m[k].sort((a, b) => a.pos - b.pos));
    return m;
  }
  const withTotals = (o, im) => {
    const items = im[o.id] || [];
    return Object.assign({}, o, { items_count: items.length, recv_done: items.filter(i => +i.recv === 1).length }, calc(items, o.vat_mode));
  };
  const settingsObj = () => { const r = {}; readAll('Settings').forEach(s => r[s.key] = s.value); return r; };

  // ---------- ตัวจัดการ API ----------
  function dashboard(roundParam) {
    const rounds = readAll('Rounds');
    const rid = roundParam === 'all' ? null : (+roundParam || (rounds[rounds.length - 1] || {}).id);
    const depts = readAll('Departments').sort((a, b) => a.sort - b.sort);
    const totalBudget = rid ? num((rounds.find(r => r.id === rid) || {}).budget) : rounds.reduce((s, r) => s + num(r.budget), 0);
    const im = itemsByOrder();
    const orders = readAll('Orders').filter(o => o.status !== 'cancelled' && (!rid || o.round_id === rid)).map(o => withTotals(o, im));
    const rows = depts.map(d => {
      const mine = orders.filter(o => o.dept_id === d.id);
      return {
        id: d.id, name: d.name, active: +d.active,
        spent: mine.filter(o => o.status === 'approved').reduce((s, o) => s + o.grand, 0),
        pending: mine.filter(o => o.status === 'pending').reduce((s, o) => s + o.grand, 0),
        approved_count: mine.filter(o => o.status === 'approved').length, pending_count: mine.filter(o => o.status === 'pending').length
      };
    }).filter(r => r.active || r.spent || r.pending);
    const t = rows.reduce((a, r) => ({ budget: a.budget, spent: a.spent + r.spent, pending: a.pending + r.pending }), { budget: totalBudget, spent: 0, pending: 0 });
    t.remaining = t.budget - t.spent;
    const byDate = {};
    orders.filter(o => o.status === 'approved').forEach(o => { byDate[o.date || ''] = (byDate[o.date || ''] || 0) + o.grand; });
    let cum = 0;
    const series = Object.keys(byDate).sort().map(d => ({ date: d, amount: byDate[d], cum: (cum += byDate[d]) }));
    return { rounds: rounds, round_id: rid, rows: rows, totals: t, series: series };
  }

  const ORDER_COLS = ['round_id', 'dept_id', 'doc_no', 'date', 'proposer', 'head', 'mat_kind', 'mat_type', 'purpose_kind', 'level', 'subject',
    'purpose_other', 'need_date', 'budget_source', 'vat_mode', 'note'];
  const DEFAULTS = { mat_kind: 'สิ้นเปลือง', mat_type: 'ก่อสร้าง', purpose_kind: 'teach', vat_mode: 'incl' };

  function saveOrder(b, existing, user) {
    const o = existing ? Object.assign({}, existing) : { created_by: user.email, created_at: nowStr(), status: 'pending', note: '' };
    ORDER_COLS.forEach(c => {
      let v = b[c] !== undefined ? b[c] : (existing ? o[c] : '');
      if ((v === '' || v == null) && DEFAULTS[c]) v = DEFAULTS[c];
      o[c] = v == null ? '' : v;
    });
    o.round_id = +o.round_id; o.dept_id = +o.dept_id;
    if (!readAll('Rounds').some(r => r.id === o.round_id)) throw err('ไม่พบรอบงบประมาณ');
    if (!readAll('Departments').some(d => d.id === o.dept_id)) throw err('ไม่พบแผนก');
    if (user.role === 'admin' && b.status) o.status = b.status;
    o.updated_at = nowStr();
    if (existing) updateRow('Orders', existing._r, o);
    else { o.id = nextId(readAll('Orders')); appendRows('Orders', [o]); }
    // แทนที่รายการวัสดุทั้งหมดของใบนี้
    const oldItems = readAll('Items').filter(i => i.order_id === o.id);
    const oldByPos = {}; oldItems.forEach(i => oldByPos[i.pos] = i);
    deleteRows('Items', oldItems.map(i => i._r));
    let iid = nextId(readAll('Items'));
    appendRows('Items', (b.items || []).filter(i => String(i.name || '').trim()).map((i, k) => {
      const name = String(i.name).trim(), prev = oldByPos[k + 1];
      const keep = prev && prev.name === name && +prev.recv === 1 ? prev : null;   // รายการเดิมที่ตรวจรับแล้ว: คงผลตรวจรับไว้
      return {
        id: iid++, order_id: o.id, pos: k + 1, name: name, qty: num(i.qty), unit: i.unit || '',
        last_price: (i.last_price === '' || i.last_price == null) ? '' : num(i.last_price), price: num(i.price),
        recv: keep ? 1 : '', recv_by: keep ? keep.recv_by : '', recv_date: keep ? keep.recv_date : '', recv_time: keep ? keep.recv_time : '', recv_note: prev && prev.name === name ? prev.recv_note : ''
      };
    }));
    return o.id;
  }

  const getOrder = id => {
    const o = readAll('Orders').find(x => x.id === +id);
    if (!o) throw err('ไม่พบใบสั่ง', 404);
    return o;
  };
  const canEdit = (user, o) => user.role === 'admin' || (o.created_by === user.email && o.status === 'pending');

  const routes = [];
  const on = (method, pattern, fn, admin) => routes.push({ method: method, re: new RegExp('^' + pattern.replace(/:\w+/g, '([^/]+)') + '$'), fn: fn, admin: !!admin });

  on('GET', '/api/ver', () => ({ ver: +props().getProperty('VER') || 0 }));
  on('GET', '/api/me', c => c.user);
  on('GET', '/api/dashboard', c => dashboard(c.q.round));
  on('GET', '/api/meta', () => ({
    departments: readAll('Departments').sort((a, b) => a.sort - b.sort), rounds: readAll('Rounds'),
    signers: readAll('Signers'), settings: settingsObj()
  }));
  on('GET', '/api/catalog', () => {
    const orders = {}; readAll('Orders').forEach(o => orders[o.id] = o.date || '');
    const best = {};
    readAll('Items').forEach(i => {
      const d = orders[i.order_id] || '';
      if (!best[i.name] || d >= best[i.name].d) best[i.name] = { name: i.name, unit: i.unit, price: i.price, d: d };
    });
    return Object.keys(best).sort().map(k => best[k]);
  });

  const deptName = {}, roundName = {};
  function listOrders(q) {
    readAll('Departments').forEach(d => deptName[d.id] = d.name);
    readAll('Rounds').forEach(r => roundName[r.id] = r.name);
    const im = itemsByOrder();
    const like = String(q.q || '').toLowerCase();
    return readAll('Orders').filter(o =>
      (!q.round || q.round === 'all' || o.round_id === +q.round) && (!q.dept || o.dept_id === +q.dept) && (!q.status || o.status === q.status) &&
      (!like || [o.doc_no, o.proposer, o.subject].some(x => String(x).toLowerCase().indexOf(like) >= 0) ||
        (im[o.id] || []).some(i => String(i.name).toLowerCase().indexOf(like) >= 0))
    ).sort((a, b) => (b.date + '').localeCompare(a.date + '') || b.id - a.id)
      .map(o => Object.assign(withTotals(o, im), { dept_name: deptName[o.dept_id], round_name: roundName[o.round_id] }));
  }
  on('GET', '/api/orders', c => listOrders(c.q));
  on('GET', '/api/orders/:id', c => {
    const o = getOrder(c.p[0]), items = itemsByOrder()[o.id] || [];
    const d = readAll('Departments').find(x => x.id === o.dept_id), r = readAll('Rounds').find(x => x.id === o.round_id);
    return Object.assign({}, o, { dept_name: d && d.name, round_name: r && r.name, items: items }, calc(items, o.vat_mode));
  });
  on('POST', '/api/orders', c => ({ id: saveOrder(c.b, null, c.user) }));
  on('PUT', '/api/orders/:id', c => {
    const o = getOrder(c.p[0]);
    if (!canEdit(c.user, o)) throw err('แก้ไขได้เฉพาะใบของตนเองที่ยังรอดำเนินการ', 403);
    return { id: saveOrder(c.b, o, c.user) };
  });
  on('POST', '/api/orders/:id/status', c => {
    const o = getOrder(c.p[0]), st = c.b.status;
    if (['pending', 'approved', 'cancelled'].indexOf(st) < 0) throw err('สถานะไม่ถูกต้อง');
    if (c.user.role !== 'admin' && !(st === 'cancelled' && o.created_by === c.user.email && o.status === 'pending'))
      throw err('เฉพาะผู้ดูแลที่อนุมัติ/เปลี่ยนสถานะได้', 403);
    o.status = st; o.updated_at = nowStr(); updateRow('Orders', o._r, o);
  });
  // เอกสารแนบ (ไม่บังคับ) ผูกกับรายการวัสดุแต่ละชิ้น (pos): แทนที่ทั้งชุดของใบนั้น
  const attRows = oid => { if (!sheet('Attachments')) setup(); return readAll('Attachments').filter(a => +a.order_id === oid); };
  on('GET', '/api/orders/:id/attachments', c => {
    const o = getOrder(c.p[0]), pages = {};
    attRows(o.id).sort((a, b) => a.page - b.page || a.part - b.part).forEach(a => {
      const p = pages[a.page] = pages[a.page] || { pos: +a.item_pos || 0, data: '' };
      p.data += a.data;
    });
    return { pages: Object.keys(pages).sort((a, b) => a - b).map(k => pages[k]) };
  });
  on('PUT', '/api/orders/:id/attachments', c => {
    const o = getOrder(c.p[0]);
    if (!canEdit(c.user, o)) throw err('แนบเอกสารได้เฉพาะใบของตนเองที่ยังรอดำเนินการ', 403);
    const pages = Array.isArray(c.b.pages) ? c.b.pages : [];
    if (pages.length > ATT_MAX_PAGES) throw err('แนบได้ไม่เกิน ' + ATT_MAX_PAGES + ' หน้า');
    let total = 0;
    pages.forEach(p => {
      if (!p || typeof p.data !== 'string' || !/^data:image\/(jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(p.data)) throw err('รูปแบบเอกสารแนบไม่ถูกต้อง');
      if (!(Math.floor(+p.pos) >= 0 && +p.pos <= 500)) throw err('ลำดับรายการที่แนบไม่ถูกต้อง');
      total += p.data.length;
    });
    if (total > ATT_MAX_CHARS) throw err('เอกสารแนบมีขนาดใหญ่เกินไป (รวมไม่เกิน ~3 MB) ลองลดจำนวนหน้า');
    const old = attRows(o.id).map(a => a._r);
    if (old.length) deleteRowsFast('Attachments', old);
    const rows = [];
    pages.forEach((p, i) => { for (let k = 0, n = 0; k < p.data.length; k += ATT_CHUNK, n++) rows.push({ order_id: o.id, page: i + 1, part: n + 1, data: p.data.slice(k, k + ATT_CHUNK), item_pos: Math.floor(+p.pos) }); });
    appendRows('Attachments', rows);
    return { pages: pages.length };
  });

  // ตรวจรับวัสดุ: ติ๊กรายการที่ได้รับแล้ว + ผู้ตรวจรับ + วันที่ (เฉพาะใบที่อนุมัติแล้ว)
  on('POST', '/api/orders/:id/receive', c => {
    const o = getOrder(c.p[0]);
    if (o.status !== 'approved') throw err('ตรวจรับได้เฉพาะใบสั่งที่อนุมัติแล้ว');
    const rows = readAll('Items').filter(i => i.order_id === o.id), list = Array.isArray(c.b.items) ? c.b.items : [];
    const str = (v, n) => String(v == null ? '' : v).slice(0, n);
    list.forEach(x => {
      const it = rows.find(r => r.pos === +x.pos); if (!it) return;
      const on_ = x.received ? 1 : 0, by = str(x.by, 100).trim(), date = str(x.date, 10);
      if (on_ && !by) throw err('ระบุชื่อผู้ตรวจรับ');
      if (on_ && !/^\d{4}-\d{2}-\d{2}$/.test(date)) throw err('ระบุวันที่ตรวจรับ');
      const time = str(x.time, 5);
      if (on_ && !/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) throw err('ระบุเวลาตรวจรับ');
      it.recv = on_ ? 1 : ''; it.recv_by = on_ ? by : ''; it.recv_date = on_ ? date : ''; it.recv_time = on_ ? time : ''; it.recv_note = str(x.note, 200);
      updateRow('Items', it._r, it);
    });
    const left = readAll('Items').filter(i => i.order_id === o.id && +i.recv !== 1).length;
    return { recv_left: left };
  });  on('DELETE', '/api/orders/:id', c => {
    const o = getOrder(c.p[0]);
    if (sheet('Attachments')) { const a = attRows(o.id).map(x => x._r); if (a.length) deleteRowsFast('Attachments', a); }
    deleteRows('Items', readAll('Items').filter(i => i.order_id === o.id).map(i => i._r));
    deleteRows('Orders', [o._r]);
  }, true);

  // รอบงบประมาณ
  on('POST', '/api/rounds', c => {
    if (!String(c.b.name || '').trim()) throw err('กรอกชื่อรอบ');
    const id = nextId(readAll('Rounds'));
    appendRows('Rounds', [{ id: id, name: c.b.name, note: '', budget: num(c.b.budget), created_at: nowStr() }]);
    return { id: id };
  }, true);
  on('PUT', '/api/rounds/:id', c => {
    const r = readAll('Rounds').find(x => x.id === +c.p[0]); if (!r) throw err('ไม่พบรอบ', 404);
    r.name = c.b.name; r.budget = num(c.b.budget); updateRow('Rounds', r._r, r);
  }, true);
  on('DELETE', '/api/rounds/:id', c => {
    if (readAll('Orders').some(o => o.round_id === +c.p[0])) throw err('รอบนี้มีใบสั่งอยู่แล้ว ลบไม่ได้');
    const r = readAll('Rounds').find(x => x.id === +c.p[0]); if (r) deleteRows('Rounds', [r._r]);
  }, true);

  // แผนก / ผู้ลงนาม / ตั้งค่า
  on('POST', '/api/departments', c => {
    const all = readAll('Departments'), id = nextId(all);
    appendRows('Departments', [{ id: id, name: c.b.name, sort: all.reduce((m, d) => Math.max(m, +d.sort || 0), 0) + 1, active: 1 }]);
    return { id: id };
  }, true);
  on('PUT', '/api/departments/:id', c => {
    const d = readAll('Departments').find(x => x.id === +c.p[0]); if (!d) throw err('ไม่พบแผนก', 404);
    d.name = c.b.name; d.active = c.b.active ? 1 : 0; updateRow('Departments', d._r, d);
  }, true);
  on('POST', '/api/signers', c => {
    const id = nextId(readAll('Signers'));
    appendRows('Signers', [{ id: id, name: c.b.name, role: c.b.role === 'head' ? 'head' : 'proposer', active: 1 }]);
    return { id: id };
  }, true);
  on('DELETE', '/api/signers/:id', c => {
    const s = readAll('Signers').find(x => x.id === +c.p[0]); if (s) deleteRows('Signers', [s._r]);
  }, true);
  on('PUT', '/api/settings', c => {

    });
  }, true);

  // ผู้ใช้งาน (อีเมลที่อนุญาต)
  on('GET', '/api/users', () => readAll('Users').map(u => Object.assign(pick(u, SCHEMA.Users), { active: +u.active })), true);
  on('POST', '/api/users', c => {
    const email = String(c.b.email || '').trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw err('รูปแบบอีเมลไม่ถูกต้อง');
    if (readAll('Users').some(u => String(u.email).toLowerCase() === email)) throw err('มีอีเมลนี้อยู่แล้ว');
    appendRows('Users', [{ email: email, name: c.b.name || '', role: c.b.role === 'admin' ? 'admin' : 'user', dept_id: c.b.dept_id || '', active: 1 }]);
  }, true);
  on('PUT', '/api/users/:email', c => {
    const email = decodeURIComponent(c.p[0]).toLowerCase();
    const all = readAll('Users'), u = all.find(x => String(x.email).toLowerCase() === email); if (!u) throw err('ไม่พบผู้ใช้', 404);
    const role = c.b.role === 'admin' ? 'admin' : 'user', active = c.b.active ? 1 : 0;

    const i = u.indexOf('?'), q = {};

      if (!p) return;
      const kv = p.split('=');
      q[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));

    return { path: i < 0 ? u : u.slice(0, i), q: q };

      .addMetaTag('viewport', 'width=device-width, initial-scale=1');
  }

  return { doGet: doGet, requestCode: requestCode, verifyCode: verifyCode, handle: handle, setup: setup };
})();

// ================= Attachment helpers =================
const ATT_MAX = 20, ATT_MAX_CHARS = 4000000, ATT_W = 1240;   // ต้องตรงกับ Code.gs ; กว้าง 1240px ≈ A4 150dpi
const attSize = a => a.reduce((s, p) => s + p.length, 0);
function canvasToJpeg(cv) {   // บีบอัดให้ไม่เกินหน้าละ ~300KB
  let q = .78, u = cv.toDataURL('image/jpeg', q);
  while (u.length > 400000 && q > .4) { q -= .1; u = cv.toDataURL('image/jpeg', q); }
  return u;
}
function newCanvas(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); return [cv, g];
}
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('โหลดตัวอ่าน PDF ไม่ได้ (ต้องเชื่อมต่ออินเทอร์เน็ต) — ลองแปลงเป็นรูปภาพแล้วแนบแทน')); document.head.appendChild(s); });
}
async function fileToPages(f, room) {
  if (f.type.startsWith('image/')) {
    const url = URL.createObjectURL(f);
    try {
      const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => fail(new Error('เปิดรูปภาพไม่ได้: ' + f.name)); i.src = url; });
      const sc = Math.min(1, ATT_W / Math.max(img.naturalWidth, img.naturalHeight * 210 / 297));
      const [cv, g] = newCanvas(Math.round(img.naturalWidth * sc), Math.round(img.naturalHeight * sc));
      g.drawImage(img, 0, 0, cv.width, cv.height);
      return [canvasToJpeg(cv)];
    } finally { URL.revokeObjectURL(url); }
  }
  if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
    if (!window.pdfjsLib) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
    if (pdf.numPages > Math.max(room, 0)) throw new Error(`ไฟล์ ${f.name} มี ${pdf.numPages} หน้า เกินจำนวนที่แนบได้ (เหลือ ${Math.max(room, 0)} หน้า)`);
    const out = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      const pg = await pdf.getPage(n), v0 = pg.getViewport({ scale: 1 }), v = pg.getViewport({ scale: ATT_W / v0.width });
      const [cv, g] = newCanvas(Math.round(v.width), Math.round(v.height));
      await pg.render({ canvasContext: g, viewport: v }).promise;
      out.push(canvasToJpeg(cv));
    }
    return out;
  }
  throw new Error('ไฟล์ ' + f.name + ' ไม่รองรับ (แนบได้เฉพาะ PDF และรูปภาพ)');
}

  const rowHtml = (it, i) => `<tr><td class="c">${i + 1}</td><td><input class="nm" list="cat" value="${esc(it.name)}"></td><td><input class="q" type="number" step="any" value="${it.qty ?? ''}"></td>
    <td><input class="u" value="${esc(it.unit)}"></td><td><input class="lp" type="number" step="any" value="${it.last_price ?? ''}"></td><td><input class="p" type="number" step="any" value="${it.price ?? ''}"></td><td class="tot">0.00</td><td class="attc"></td></tr>`;
  const readItems = () => $$('tr', tb).map(tr => ({ name: $('.nm', tr).value, qty: $('.q', tr).value, unit: $('.u', tr).value, last_price: $('.lp', tr).value, price: $('.p', tr).value }));
  let budget = null;
  const recalc = () => {
    let sum = 0;
    $$('tr', tb).forEach(tr => { const t = (+$('.q', tr).value || 0) * (+$('.p', tr).value || 0); sum += t; $('.tot', tr).textContent = t ? fmt(t) : ''; });
    const mode = $('#f_vat').value;
    const vat = mode === 'incl' ? sum * 7 / 107 : mode === 'excl' ? sum * .07 : 0;
    const grand = mode === 'excl' ? sum + vat : sum;
    $('#t_before').textContent = fmt(mode === 'incl' ? sum - vat : sum); $('#t_vat').textContent = fmt(vat); $('#t_grand').textContent = fmt(grand);
    if (budget) {
      const avail = budget.remaining - budget.pending + (+$('#f_round').value === o.round_id ? ownSaved : 0);
      $('#overbud').innerHTML = grand > avail ? `<div class="alert">⚠ ยอดนี้เกินงบรวมคงเหลือของสาขา (คงเหลือใช้ได้ ${fmt(avail)} บาท)</div>` : '';
    }
  };
  const addRows = n => { for (let k = 0; k < n; k++) tb.insertAdjacentHTML('beforeend', rowHtml({ name: '', qty: '', unit: '', last_price: '', price: '' }, tb.children.length)); $$('tr', tb).forEach(drawAtt); };
  tb.innerHTML = o.items.map(rowHtml).join('');
  tb.oninput = e => {
    if (e.target.classList.contains('nm')) { const c = catMap[e.target.value]; if (c) { const tr = e.target.closest('tr'); if (!$('.u', tr).value) $('.u', tr).value = c.unit; if (!$('.lp', tr).value) $('.lp', tr).value = c.price; } }
    recalc();
  };
  $('#addrow').onclick = () => addRows(5);
  $('#f_vat').onchange = recalc;
  ['f_prop', 'f_head'].forEach(id => $('#' + id).onchange = async e => {
    if (e.target.value === '__new') { const n = await uiPrompt('พิมพ์ชื่อผู้ลงนาม'); e.target.insertAdjacentHTML('afterbegin', `<option>${esc(n || '')}</option>`); e.target.value = n || ''; }
  });
  const loadBudget = async () => {
    const d = await api('/api/dashboard?round=' + $('#f_round').value);
    const t = d.totals, mine = d.rows.find(r => r.id === +$('#f_dept').value);
    budget = t;
    $('#budinfo').innerHTML = `งบรวมของสาขาในรอบนี้: <b>${fmt(t.budget)}</b> • ใช้ไปทั้งสาขา ${fmt(t.spent)} • รอดำเนินการ ${fmt(t.pending)} • คงเหลือ <b class="${t.remaining < 0 ? 'neg' : ''}">${fmt(t.remaining)}</b> บาท${mine ? ` <br>แผนกนี้ใช้ไปแล้ว <b>${fmt(mine.spent)}</b> บาท (รอดำเนินการ ${fmt(mine.pending)})` : ''}`;
    recalc();
  };
  $('#f_round').onchange = $('#f_dept').onchange = loadBudget;
  loadBudget();

  // ---- เอกสารแนบรายรายการ (ไม่บังคับ): แปลง PDF/รูป เป็นภาพทีละหน้า เก็บไว้กับแถวนั้น ----
  const ST = { none: ['ไม่มีเอกสารแนบ', 'var(--mut)'], busy: ['กำลังเตรียมไฟล์…', 'var(--warn)'], ready: n => [`แนบแล้ว ${n} หน้า • รอกดบันทึก`, 'var(--pri)'], saved: n => [`✔ อัปโหลดเสร็จสมบูรณ์ • ${n} หน้า`, 'var(--ok)'], error: ['✖ แนบไม่สำเร็จ', 'var(--bad)'] };
  const attOf = tr => tr._a = tr._a || { pages: [], state: 'none' };
  const attTotal = () => $$('tr', tb).reduce((s, tr) => s + attOf(tr).pages.length, 0);
  function drawAtt(tr) {
    const a = attOf(tr), n = a.pages.length;
    const [txt, col] = typeof ST[a.state] === 'function' ? ST[a.state](n) : ST[a.state];
    $('.attc', tr).innerHTML = `<div class="atrow"><button type="button" class="sec sm ab" ${a.state === 'busy' ? 'disabled' : ''}>📎 ${n ? 'เพิ่มไฟล์' : 'แนบไฟล์'}</button>${n && a.state !== 'busy' ? '<button type="button" class="bad sm ad">ลบ</button>' : ''}</div><div class="ats" style="color:${col}">${txt}</div>`;
  }
  $$('tr', tb).forEach(drawAtt);
  let attChanged = false, attSig0 = '', attTarget = null;
  document.getElementById('attfile')?.remove();
  const fileIn = document.createElement('input'); fileIn.id = 'attfile'; fileIn.type = 'file'; fileIn.accept = 'image/*,application/pdf'; fileIn.multiple = true; fileIn.hidden = true; document.body.appendChild(fileIn);
  tb.addEventListener('click', e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    if (e.target.closest('.ab')) { attTarget = tr; fileIn.click(); }
    if (e.target.closest('.ad')) { const a = attOf(tr); a.pages = []; a.state = 'none'; attChanged = true; drawAtt(tr); }
  });
  fileIn.onchange = async () => {
    const files = [...fileIn.files], tr = attTarget; fileIn.value = '';
    if (!files.length || !tr) return;
    const a = attOf(tr), keep = a.pages.slice(), prev = a.state; a.state = 'busy'; drawAtt(tr);
    try {
      let add = [];
      for (const f of files) add = add.concat(await fileToPages(f, ATT_MAX - attTotal() - add.length));
      if (attTotal() + add.length > ATT_MAX) throw new Error(`แนบได้รวมไม่เกิน ${ATT_MAX} หน้าต่อใบสั่ง`);
      a.pages = keep.concat(add);
      if (attSize($$('tr', tb).flatMap(r => attOf(r).pages)) > ATT_MAX_CHARS) throw new Error('เอกสารแนบมีขนาดใหญ่เกินไป (รวมไม่เกินประมาณ 3 MB) ลองแนบให้น้อยหน้าลง');
      a.state = 'ready'; attChanged = true;
    } catch (err) { a.pages = keep; a.state = keep.length ? prev : 'none'; drawAtt(tr); await uiAlert(err.message); }
    drawAtt(tr);
  };
  const attPayload = () => {   // [{pos, data}] ตามลำดับรายการที่มีชื่อ (ตรงกับที่เซิร์ฟเวอร์ใส่ pos)
    let k = 0; const out = [];
    $$('tr', tb).forEach(tr => { if (!$('.nm', tr).value.trim()) return; k++; attOf(tr).pages.forEach(data => out.push({ pos: k, data })); });
    return out;
  };
  if (!isNew) api('/api/orders/' + id + '/attachments').then(r => {
    if (attChanged) return;
    const rows = $$('tr', tb);
    (r.pages || []).forEach(p => { const tr = rows[Math.max(p.pos, 1) - 1]; if (tr) { const a = attOf(tr); a.pages.push(p.data); a.state = 'saved'; } });
    rows.forEach(drawAtt); attSig0 = attPayload().map(p => p.pos).join(',');
  }).catch(() => { });
  const save = guard(async print => {
    const body = {
      round_id: +$('#f_round').value, dept_id: +$('#f_dept').value, doc_no: $('#f_doc').value, date: $('#f_date').value, mat_kind: $('#f_kind').value, mat_type: $('#f_type').value,
      need_date: $('#f_need').value, purpose_kind: $('input[name=purpose_kind]:checked')?.value || 'teach', level: $('#f_level').value, subject: $('#f_subject').value, purpose_other: $('#f_pother').value,
      budget_source: $('#f_bsrc').value, proposer: $('#f_prop').value === '__new' ? '' : $('#f_prop').value, head: $('#f_head').value === '__new' ? '' : $('#f_head').value,
      vat_mode: $('#f_vat').value, status: $('#f_status') ? $('#f_status').value : undefined, items: readItems()
    };
    if (!body.items.some(i => i.name.trim())) return uiAlert('กรุณากรอกรายการวัสดุอย่างน้อย 1 รายการ');
    const r = isNew ? await api('/api/orders', 'POST', body) : await api('/api/orders/' + id, 'PUT', body);
    const ap = attPayload();
    if (attChanged || ap.map(p => p.pos).join(',') !== attSig0) {
      $$('tr', tb).forEach(tr => { const a = attOf(tr); if (a.pages.length) { a.state = 'busy'; drawAtt(tr); } });
      toast('กำลังอัปโหลดเอกสารแนบ…');
      await api('/api/orders/' + r.id + '/attachments', 'PUT', { pages: ap });
      $$('tr', tb).forEach(tr => { const a = attOf(tr); if (a.pages.length) { a.state = 'saved'; drawAtt(tr); } });
    }
    const withA = new Set(ap.map(p => p.pos)).size, total = body.items.filter(i => i.name.trim()).length;
    toast(`บันทึกแล้ว • เอกสารแนบ: มี ${withA} รายการ, ไม่มี ${total - withA} รายการ`);
    if (withA) await new Promise(res => setTimeout(res, 1300));
    location.hash = print ? '#/print/' + r.id : '#/orders';
  });
  $('#save').onclick = () => save(false); $('#savep').onclick = () => save(true);
}

async function viewReceive(id) {
  const [o, m] = await Promise.all([api('/api/orders/' + id), api('/api/meta')]);
  if (o.status !== 'approved') { app.innerHTML = `<h1>ตรวจรับวัสดุ</h1><div class="card">ใบสั่งนี้ยังไม่ได้อนุมัติ จึงยังตรวจรับไม่ได้ (สถานะ: ${STATUS[o.status]})</div><a class="btn sec" href="#/receive">กลับ</a>`; return; }
  const names = [...new Set([ME.name, ...m.signers.map(s => s.name)].filter(Boolean))];
  app.innerHTML = `<h1>ตรวจรับวัสดุ — ใบสั่งเลขที่ ${esc(o.doc_no) || '#' + o.id}</h1>
  <div class="card" style="font-size:14px">แผนก <b>${esc(o.dept_name)}</b> • วันที่ขอซื้อ ${thDate(o.date)} • ผู้เสนอ ${esc(o.proposer) || '-'} • ยอดรวม ${fmt(o.grand)} บาท</div>
  <div class="card"><div class="row">
    <div><label>ผู้ตรวจรับ (ชื่อ-สกุล)</label><input id="r_by" list="r_names" value="${esc(ME.name || '')}"><datalist id="r_names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
    <div><label>วันที่ตรวจรับ</label><input type="date" id="r_date" value="${today()}"></div>
    <div><label>เวลา (น.)</label><input type="time" id="r_time" value="${new Date().toTimeString().slice(0, 5)}"></div>
    <div class="fix"><button class="sec" id="r_all" type="button">ติ๊กได้รับครบทุกรายการ</button></div>
    <div class="fix"><button class="sec" id="r_none" type="button">ล้างเครื่องหมาย</button></div>
  </div>
  <div style="font-size:12px;color:var(--mut);margin-top:6px">รายการที่ติ๊กใหม่จะบันทึกชื่อผู้ตรวจรับและวันที่ตามช่องด้านบน ส่วนรายการที่ตรวจรับไว้แล้วจะคงชื่อและวันที่เดิม</div></div>
  <div class="card" style="padding:0;overflow:auto"><table class="t rcv"><thead><tr><th style="width:60px" class="c">ได้รับ</th><th style="width:40px">#</th><th>ชื่อวัสดุ</th><th class="r" style="width:110px">จำนวน</th><th style="width:70px">หน่วย</th><th style="width:240px">หมายเหตุ (เช่น ขาด/ชำรุด)</th><th style="width:230px">ผู้ตรวจรับ / วันที่</th></tr></thead>
  <tbody id="r_rows">${o.items.map(it => `<tr data-pos="${it.pos}" data-by="${esc(+it.recv === 1 ? it.recv_by : '')}" data-date="${esc(+it.recv === 1 ? it.recv_date : '')}" data-time="${esc(+it.recv === 1 ? it.recv_time : '')}" class="${+it.recv === 1 ? 'done' : ''}">
    <td class="c"><input type="checkbox" class="rc" ${+it.recv === 1 ? 'checked' : ''}></td><td>${it.pos}</td><td>${esc(it.name)}</td><td class="r">${it.qty}</td><td>${esc(it.unit)}</td>
    <td><input class="rn" value="${esc(it.recv_note)}" maxlength="200"></td><td class="rwho"></td></tr>`).join('')}</tbody></table></div>
  <div id="r_sum" style="margin:0 0 10px;font-weight:700"></div>
  <div class="toolbar"><button id="r_save">บันทึกผลตรวจรับ</button><a class="btn sec" href="#/receive">กลับ</a></div>`;
  const rows = () => $$('#r_rows tr');
  const refresh = () => {
    let n = 0;
    rows().forEach(tr => {
      const on = $('.rc', tr).checked; n += on ? 1 : 0; tr.classList.toggle('done', on);
      $('.rwho', tr).innerHTML = !on ? '<span style="color:var(--mut)">—</span>' : tr.dataset.by ? `${esc(tr.dataset.by)} • ${thDate(tr.dataset.date)}${hm(tr.dataset.time)}` : `<span style="color:var(--pri)">${esc($('#r_by').value || '(ยังไม่ระบุชื่อ)')} • ${thDate($('#r_date').value)}${hm($('#r_time').value)}</span>`;
    });
    const tot = rows().length;
    $('#r_sum').innerHTML = n === tot ? '<span style="color:var(--ok)">✔ ได้รับของครบทุกรายการ</span>' : `ได้รับแล้ว ${n} จาก ${tot} รายการ <span style="color:var(--warn)">(ยังไม่ครบ ${tot - n} รายการ)</span>`;
  };
  $('#r_rows').onchange = e => { if (e.target.classList.contains('rc')) { const tr = e.target.closest('tr'); if (!e.target.checked) { tr.dataset.by = ''; tr.dataset.date = ''; tr.dataset.time = ''; } refresh(); } };
  $('#r_by').oninput = $('#r_date').oninput = $('#r_time').oninput = refresh;
  $('#r_all').onclick = () => { rows().forEach(tr => $('.rc', tr).checked = true); refresh(); };
  $('#r_none').onclick = () => { rows().forEach(tr => { $('.rc', tr).checked = false; tr.dataset.by = ''; tr.dataset.date = ''; tr.dataset.time = ''; }); refresh(); };
  $('#r_save').onclick = guard(async () => {
    const by = $('#r_by').value.trim(), date = $('#r_date').value, time = $('#r_time').value;
    const items = rows().map(tr => { const on = $('.rc', tr).checked; return { pos: +tr.dataset.pos, received: on, note: $('.rn', tr).value, by: on ? (tr.dataset.by || by) : '', date: on ? (tr.dataset.date || date) : '', time: on ? (tr.dataset.time || time) : '' }; });
    if (items.some(i => i.received && !i.time)) return uiAlert('กรุณาระบุเวลาตรวจรับ');
    if (items.some(i => i.received && !i.by)) return uiAlert('กรุณาระบุชื่อผู้ตรวจรับ');
    if (items.some(i => i.received && !i.date)) return uiAlert('กรุณาระบุวันที่ตรวจรับ');
    const r = await api('/api/orders/' + id + '/receive', 'POST', { items });
    toast(r.recv_left ? `บันทึกแล้ว — ยังไม่ครบ ${r.recv_left} รายการ` : 'บันทึกแล้ว — ได้รับของครบทุกรายการ');
    location.hash = '#/receive';
  });
  refresh();
}

// ================= Settings =================
let setRoundId = null;
async function viewSettings() {
  const [m, users] = await Promise.all([api('/api/meta'), api('/api/users')]);
  if (!m.rounds.find(r => r.id === setRoundId)) setRoundId = m.rounds[m.rounds.length - 1]?.id;
  const rd = m.rounds.find(r => r.id === setRoundId);
  app.innerHTML = `<h1>ตั้งค่า</h1>
  <div class="card"><h2>รอบงบประมาณ</h2>
    <div class="row"><div><label>เลือกรอบเพื่อกรอก/แก้ไขงบ</label>${roundSelect(m.rounds, setRoundId, 'sr', false)}</div>
      <div><label>ชื่อรอบ</label><input id="rname" value="${esc(rd?.name)}"></div>
      <div><label>งบประมาณรวมของสาขาในรอบนี้ (บาท)</label><input id="rbudget" type="number" step="any" value="${rd?.budget || ''}" placeholder="0"></div>
      <div class="fix"><button id="rsave">บันทึก</button></div>
      <div class="fix"><button class="bad sm" id="rdel">ลบรอบนี้</button></div></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <h2>เพิ่มรอบใหม่</h2>
    <div class="row"><div><label>ชื่อรอบ</label><input id="nrname" placeholder="เช่น รอบที่ 2 / ภาคเรียนที่ 2/2569"></div>
      <div><label>งบประมาณรวมของรอบนี้ (บาท)</label><input id="nrbudget" type="number" step="any" placeholder="0"></div>
      <div class="fix"><button id="nradd">+ เพิ่มรอบ</button></div></div></div>
  <div class="card"><h2>ผู้ใช้งานที่อนุญาตเข้าสู่ระบบ (อีเมล)</h2><div style="overflow:auto"><table class="t">
    <tr><th>อีเมล</th><th>ชื่อ</th><th>สิทธิ์</th><th>แผนกประจำ</th><th>ใช้งาน</th><th></th></tr>
    ${users.map(u => `<tr data-u="${esc(u.email)}"><td>${esc(u.email)}</td><td><input class="un" value="${esc(u.name)}"></td>
      <td><select class="ur"><option value="user" ${u.role === 'user' ? 'selected' : ''}>ผู้ใช้ทั่วไป</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>ผู้ดูแล</option></select></td>
      <td><select class="ud"><option value="">—</option>${m.departments.map(d => `<option value="${d.id}" ${u.dept_id == d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></td>
      <td class="c"><input type="checkbox" class="ua" ${u.active ? 'checked' : ''}></td><td><button class="bad sm ux">ลบ</button></td></tr>`).join('')}
  </table></div>
  <div class="row" style="margin-top:8px"><div><input id="nuemail" placeholder="อีเมลใหม่"></div><div><input id="nuname" placeholder="ชื่อ"></div>
    <div class="fix" style="min-width:130px"><select id="nurole"><option value="user">ผู้ใช้ทั่วไป</option><option value="admin">ผู้ดูแล</option></select></div><div class="fix"><button id="nuadd">+ เพิ่มผู้ใช้</button></div></div>
  <div style="font-size:12px;color:var(--mut);margin-top:6px">ผู้ใช้ทั่วไป: สร้างใบสั่ง และแก้ไข/ยกเลิกเฉพาะใบของตนที่ยังรอดำเนินการ • ผู้ดูแล: อนุมัติ ลบ และตั้งค่าทั้งหมด</div></div>
  <div class="grid2">
  <div class="card"><h2>แผนก</h2><table class="t">${m.departments.map(d => `<tr><td><input class="dn" data-d="${d.id}" value="${esc(d.name)}"></td><td style="width:110px"><label class="inl" style="font-size:13px"><input type="checkbox" class="da" data-d="${d.id}" ${d.active ? 'checked' : ''}> ใช้งาน</label></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:8px"><div><input id="ndept" placeholder="ชื่อแผนกใหม่"></div><div class="fix"><button id="ndadd">+ เพิ่มแผนก</button></div></div></div>
  <div class="card"><h2>ผู้ลงนาม (ให้เลือกในใบสั่ง)</h2><table class="t">${m.signers.map(s => `<tr><td>${esc(s.name)}</td><td>${s.role === 'proposer' ? 'ผู้เสนอขอซื้อ' : 'หัวหน้าสาขา'}</td><td class="r"><button class="bad sm" data-sd="${s.id}">ลบ</button></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:8px"><div><input id="nsname" placeholder="ชื่อ-สกุล (รวมคำนำหน้า)"></div><div class="fix" style="min-width:140px"><select id="nsrole"><option value="proposer">ผู้เสนอขอซื้อ</option><option value="head">หัวหน้าสาขา</option></select></div><div class="fix"><button id="nsadd">+ เพิ่ม</button></div></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h2>หัวฟอร์ม</h2>
    <label>หน่วยงาน</label><input id="s_org" value="${esc(m.settings.org)}"><label style="margin-top:6px">สาขา</label><input id="s_branch" value="${esc(m.settings.branch)}">
    <div style="margin-top:8px"><button id="ssave">บันทึก</button></div></div></div>`;
  const R = (sel, fn) => { $(sel).onclick = guard(async () => { await fn(); await viewSettings(); }); };
  $('#sr').onchange = e => { setRoundId = +e.target.value; viewSettings(); };
  R('#rsave', async () => { await api('/api/rounds/' + setRoundId, 'PUT', { name: $('#rname').value, budget: $('#rbudget').value }); toast('บันทึกงบแล้ว'); });
  R('#rdel', async () => { if (await uiConfirm('ลบรอบนี้?')) await api('/api/rounds/' + setRoundId, 'DELETE'); });
  R('#nradd', async () => { if (!$('#nrname').value.trim()) return uiAlert('กรอกชื่อรอบ'); const r = await api('/api/rounds', 'POST', { name: $('#nrname').value, budget: $('#nrbudget').value }); setRoundId = r.id; setRound(String(r.id)); toast('เพิ่มรอบแล้ว — กรอกงบได้เลย'); });
  R('#ndadd', async () => { if ($('#ndept').value.trim()) await api('/api/departments', 'POST', { name: $('#ndept').value.trim() }); });
  $$('.dn,.da').forEach(el => el.onchange = guard(async () => { const d = el.dataset.d; await api('/api/departments/' + d, 'PUT', { name: $(`.dn[data-d="${d}"]`).value, active: $(`.da[data-d="${d}"]`).checked }); toast('บันทึกแล้ว'); }));
  R('#nsadd', async () => { if ($('#nsname').value.trim()) await api('/api/signers', 'POST', { name: $('#nsname').value.trim(), role: $('#nsrole').value }); });
  $$('[data-sd]').forEach(b => b.onclick = guard(async () => { await api('/api/signers/' + b.dataset.sd, 'DELETE'); viewSettings(); }));
  $$('tr[data-u]').forEach(tr => {
    const url = '/api/users/' + encodeURIComponent(tr.dataset.u);
    const save = async () => { try { await api(url, 'PUT', { name: $('.un', tr).value, role: $('.ur', tr).value, dept_id: $('.ud', tr).value, active: $('.ua', tr).checked }); toast('บันทึกแล้ว'); } catch (e) { await uiAlert(e.message); viewSettings(); } };
    $$('.un,.ur,.ud,.ua', tr).forEach(el => el.onchange = save);
    $('.ux', tr).onclick = guard(async () => { if (await uiConfirm('ลบผู้ใช้ ' + tr.dataset.u + ' ?')) { await api(url, 'DELETE'); viewSettings(); } });
  });
  R('#nuadd', async () => { await api('/api/users', 'POST', { email: $('#nuemail').value, name: $('#nuname').value, role: $('#nurole').value }); toast('เพิ่มผู้ใช้แล้ว'); });
  R('#ssave', async () => { await api('/api/settings', 'PUT', { org: $('#s_org').value, branch: $('#s_branch').value }); toast('บันทึกแล้ว'); });
}

boot();

</script>

</body>
</html>
